name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Скачивает вложенные папки, если они есть

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    # ⚠️ ВНИМАНИЕ: Здесь указан путь к папке с проектом. 
    # Если папка называется иначе, измените 'zedgththdh/amix-native' на правильное название.
    # Если файлы лежат прямо в корне (без папок), замените на точку: working-directory: .
    - name: Generate Gradle Wrapper
      working-directory: zedgththdh/amix-native
      run: gradle wrapper --gradle-version 8.9

    - name: Make gradlew executable
      working-directory: zedgththdh/amix-native
      run: chmod +x gradlew

    - name: Install JS Dependencies
      working-directory: zedgththdh/amix-native
      run: |
        if [ -f package.json ]; then
          npm install
        fi

    - name: Build Debug APK
      working-directory: zedgththdh/amix-native
      run: ./gradlew assembleDebug --stacktrace

    # ⚠️ ВНИМАНИЕ: Здесь тоже нужно проверить путь к APK файлу
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: amix-debug-apk
        path: zedgththdh/amix-native/app/build/outputs/apk/debug/*.apk
        retention-days: 14
